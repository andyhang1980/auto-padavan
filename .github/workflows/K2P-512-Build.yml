name: Build K2P-512 Padavan

on: 
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget
        
    - name: Clone source code
      run: |
        git clone --depth=1 https://github.com/a0575/padavan.git /opt/rt-n56u
        cd /opt/rt-n56u/toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images/

    - name: Update SS core to 3.3.6 (CMake build)
      run: |
        set -e
        SSDIR=/opt/rt-n56u/trunk/user/shadowsocks
        cd "$SSDIR"

        ################################################################################
        # shadowsocks-libev 3.3.6 (shadowsocks/shadowsocks-c, 2026-02) 已改为纯 CMake 工程,
        # release 包内无 configure/autogen, 且 libcork/libipset/libbloom 子模块目录为空,
        # 因此不能沿用 autotools 流程, 需: 补子模块 + 去 -Werror + Makefile 改走 cmake。
        ################################################################################
        wget -q --timeout=60 -t3 -O shadowsocks-libev-3.3.6.tar.gz \
          https://github.com/shadowsocks/shadowsocks-c/releases/download/v3.3.6/shadowsocks-libev-3.3.6.tar.gz
        test -s shadowsocks-libev-3.3.6.tar.gz
        tar xf shadowsocks-libev-3.3.6.tar.gz
        cd shadowsocks-libev-3.3.6

        # 1) 补齐 release 包缺失的子模块源码
        #    必须 checkout 到 tag v3.3.6 的 pinned 提交(与上游 submodules:recursive 一致):
        #    master 上 libcork/include/libcork/config/version.h 只剩 .in 模板,
        #    而根 CMakeLists 不生成它 → 用 pinned 提交(含已生成 version.h)避免编译中断
        PIN_LIBCORK=074e074b26e9e372e90e6ade215217763c8644aa
        PIN_LIBIPSET=3ea7fe30adf4b39b27d932e5a70a2ddce4adb508
        PIN_LIBBLOOM=437e1add5a2b9a87797d8c648df7cf5f3ee155a8
        for pair in "libcork:libcork:$PIN_LIBCORK" "ipset:libipset:$PIN_LIBIPSET" "libbloom:libbloom:$PIN_LIBBLOOM"; do
          repo=${pair%%:*}; rest=${pair#*:}; dest=${rest%%:*}; sha=${rest##*:}
          if [ -z "$(ls -A "$dest" 2>/dev/null)" ]; then
            mkdir -p "$dest"
            git clone -q "https://github.com/shadowsocks/$repo.git" "/tmp/sssub-$repo"
            git -C "/tmp/sssub-$repo" checkout -q --detach "$sha"
            cp -a "/tmp/sssub-$repo/." "$dest/"
            rm -rf "/tmp/sssub-$repo"
          fi
        done
        test -f libcork/src/libcork/core/error.c
        test -f libipset/src/libipset/set/storage.c
        test -f libbloom/bloom.c
        test -f libcork/include/libcork/config/version.h

        # 2) 旧 mips uclibc gcc 对新源码的告警会经 -Werror 变成错误, 去掉 -Werror
        grep -q -- '-Werror' src/CMakeLists.txt
        sed -i 's/-Werror//g' src/CMakeLists.txt
        ! grep -q -- '-Werror' src/CMakeLists.txt

        # 3) 根 CMakeLists 跳过 doc 子目录(避免依赖 asciidoc/xmlto)
        grep -q '^add_subdirectory(doc)' CMakeLists.txt
        sed -i 's/^add_subdirectory(doc)/#add_subdirectory(doc)/' CMakeLists.txt

        # 3.5) stage 中 mbedtls/c-ares 只安装 .so(包 Makefile 关静态/默认共享),
        #      而 src/CMakeLists.txt 静态 find_library(*.a) 必然 NOTFOUND → 改用共享库名
        grep -q 'find_library(LIBMBEDTLS libmbedtls.a' src/CMakeLists.txt
        grep -q 'find_library(LIBUDNS libcares.a)' src/CMakeLists.txt
        sed -i 's/find_library(LIBMBEDTLS libmbedtls\.a/find_library(LIBMBEDTLS mbedtls/g' src/CMakeLists.txt
        sed -i 's/find_library(LIBMBEDCRYPTO libmbedcrypto\.a/find_library(LIBMBEDCRYPTO mbedcrypto/g' src/CMakeLists.txt
        sed -i 's/find_library(LIBUDNS libcares\.a)/find_library(LIBUDNS cares)/g' src/CMakeLists.txt
        ! grep -q 'libmbedtls\.a\|libmbedcrypto\.a\|libcares\.a' src/CMakeLists.txt

        cd "$SSDIR"

        # 4) 重写 shadowsocks/Makefile: configure_ss 改为 cmake 交叉配置, romfs 改取 bin/ 产物
        python3 - << 'SS_MK_PY'
        p = '/opt/rt-n56u/trunk/user/shadowsocks/Makefile'
        s = open(p).read()

        # 4.0 SRC_SS_NAME 指向 3.3.6(prepare 步已解压到同目录, extract_ss_test 见目录存在即跳过)
        a = 'SRC_SS_NAME=shadowsocks-libev-3.3.5'
        assert s.count(a) == 1, 'anchor: SRC_SS_NAME 3.3.5'
        s = s.replace(a, 'SRC_SS_NAME=shadowsocks-libev-3.3.6')

        # 4.1 all 目标: 只编静态 ss 程序(跳过 shared/doc 等目标)
        a = '\t$(MAKE) -j$(HOST_NCPU) -C $(SRC_SS_NAME)\n'
        assert s.count(a) == 1, 'anchor: all SS make line'
        s = s.replace(a, '\t$(MAKE) -j$(HOST_NCPU) -C $(SRC_SS_NAME) ss-local ss-redir ss-tunnel ss-server\n')

        # 4.2 configure_ss: autotools ./configure -> cmake (生成 mipsel 交叉工具链文件)
        assert s.count('configure_ss:') == 1, 'anchor: configure_ss target'
        i = s.index('configure_ss:')
        j = s.index('\nclean: clean_ssr clean_ss')
        blk = s[i:j]
        assert 'ac_cv_prog_PCRE_CONFIG' in blk and '--host=$(HOST_TARGET)' in blk, 'configure_ss block content'
        fmt = (r'set(CMAKE_SYSTEM_NAME Linux)\n'
               r'set(CMAKE_SYSTEM_PROCESSOR mips)\n'
               r'set(CMAKE_C_COMPILER "%s")\n'
               r'set(CMAKE_CXX_COMPILER "%s")\n'
               r'set(CMAKE_PREFIX_PATH "%s")\n'
               r'set(CMAKE_PROGRAM_PATH "%s/bin")\n'
               r'set(CMAKE_C_FLAGS_INIT "%s -I%s/include")\n'
               r'set(CMAKE_EXE_LINKER_FLAGS_INIT "-L%s/lib -Wl,-rpath-link,%s/lib")\n')
        printf_line = (
            "\tprintf '" + fmt + "' "
            '"$(CROSS_COMPILE)gcc" "$(CROSS_COMPILE)g++" "$(STAGEDIR)" "$(STAGEDIR)" '
            '"$(CPUFLAGS)" "$(STAGEDIR)" "$(STAGEDIR)" "$(STAGEDIR)" > $(THISDIR)/mipsel-tc.cmake ; \\\n')
        new = (
            'configure_ss:\n'
            '\t( cd $(SRC_SS_NAME) ; \\\n'
            '\trm -rf CMakeCache.txt CMakeFiles ; \\\n'
            + printf_line +
            '\tPKG_CONFIG_PATH= PKG_CONFIG_LIBDIR="$(STAGEDIR)/lib/pkgconfig" \\\n'
        '\tcmake . \\\n'
        '\t\t-DCMAKE_TOOLCHAIN_FILE=$(THISDIR)/mipsel-tc.cmake \\\n'
        '\t\t-DCMAKE_BUILD_TYPE=Release \\\n'
        '\t\t-DDISABLE_SSP=ON \\\n'
        '\t\t-DBUILD_TESTING=OFF ; \\\n'
        '\t)\n')
        s = s[:i] + new + s[j+1:]

        # 4.3 romfs: cmake 产物位于 bin/ 而非 src/
        for t in ('ss-redir', 'ss-tunnel', 'ss-local', 'ss-server'):
            a = '$(THISDIR)/$(SRC_SS_NAME)/src/%s' % t
            assert s.count(a) == 1, 'anchor: romfs ' + t
            s = s.replace(a, '$(THISDIR)/$(SRC_SS_NAME)/bin/%s' % t)

        open(p, 'w').write(s)
        print('shadowsocks/Makefile patched: cmake build, romfs -> bin/')
        SS_MK_PY

        # 5) libs/Makefile: SHADOWSOCKS 依赖新增 libpcre2(3.3.6 需要 PCRE2, 原树只有 PCRE1)
        #    并创建 trunk/libs/libpcre2 包(源码包在 CI 内下载)
        python3 - << 'SS_LIBS_PY'
        import os, re
        p = '/opt/rt-n56u/trunk/libs/Makefile'
        s = open(p).read()

        a = 'LIBS_INCLUDE_LIBPCRE=n'
        assert s.count(a) == 1, 'anchor: LIBPCRE=n'
        s = s.replace(a, a + '\nLIBS_INCLUDE_LIBPCRE2=n')

        a = 'ifeq ($(CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS),y)\nLIBS_INCLUDE_LIBPCRE=y'
        assert s.count(a) == 1, 'anchor: SHADOWSOCKS deps block'
        s = s.replace(a, a + '\nLIBS_INCLUDE_LIBPCRE2=y')

        m = re.search(r'^dir_\$\(LIBS_INCLUDE_LIBPCRE\)\s*\+= libpcre\s*$', s, re.M)
        assert m, 'anchor: dir libpcre'
        s = s[:m.end()] + '\ndir_$(LIBS_INCLUDE_LIBPCRE2) += libpcre2' + s[m.end():]
        open(p, 'w').write(s)

        d = '/opt/rt-n56u/trunk/libs/libpcre2'
        os.makedirs(d, exist_ok=True)
        mk = '\n'.join([
            'SRC_NAME=pcre2-10.42',
            'SRC_URL=https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.42/pcre2-10.42.tar.bz2',
            '',
            'all: download_test extract_test config_test',
            '\t$(MAKE) -j$(HOST_NCPU) -C $(SRC_NAME)',
            '',
            'download_test:',
            '\t( if [ ! -f $(SRC_NAME).tar.bz2 ]; then \\',
            '\t\twget -t5 --timeout=30 --no-check-certificate -O $(SRC_NAME).tar.bz2 $(SRC_URL); \\',
            '\tfi )',
            '',
            'extract_test:',
            '\t( if [ ! -d $(SRC_NAME) ]; then \\',
            '\t\ttar xjf $(SRC_NAME).tar.bz2 ; \\',
            '\tfi )',
            '',
            'config_test:',
            '\t( if [ -f ./config_done ]; then \\',
            '\t\techo "the same configuration"; \\',
            '\telse \\',
            '\t\tmake configure && touch config_done; \\',
            '\tfi )',
            '',
            'configure:',
            '\t( cd $(SRC_NAME) ; \\',
            '\t./configure \\',
            '\t\t--prefix=$(STAGEDIR) \\',
            '\t\t--disable-pcre2-16 \\',
            '\t\t--disable-pcre2-32 \\',
            '\t\t--disable-cpp \\',
            '\t\t--host=$(HOST_TARGET) \\',
            '\t\t--build=$(HOST_BUILD) ; \\',
            '\t)',
            '',
            'clean:',
            '\tif [ -f $(SRC_NAME)/Makefile ] ; then \\',
            '\t\t$(MAKE) -C $(SRC_NAME) distclean ; \\',
            '\tfi ; \\',
            '\trm -f config_done',
            '',
            'install:',
            '\t$(MAKE) -C $(SRC_NAME) install DESTDIR=""',
            '',
            'romfs:',
            '',
        ])
        open(d + '/Makefile', 'w').write(mk + '\n')
        print('libs/Makefile patched + libpcre2 package created')
        SS_LIBS_PY

        # 6) 校验
        grep -q 'cmake .' "$SSDIR/Makefile"
        grep -q 'SRC_SS_NAME=shadowsocks-libev-3.3.6' "$SSDIR/Makefile"
        grep -q '$(SRC_SS_NAME)/bin/ss-local' "$SSDIR/Makefile"
        grep -q 'libpcre2' /opt/rt-n56u/trunk/libs/Makefile
        test -f /opt/rt-n56u/trunk/libs/libpcre2/Makefile
        echo "SS 3.3.6 prepare OK"

    - name: Add Xray core (VLESS) support
      run: |
        set -e
        ############################################################################
        # shadowsocks 扩展 xray 内核: ss_type=2 → xray(VLESS, tcp/ws + TLS)
        # - 服务器/端口/UUID 复用 ss_server / ss_server_port / ss_key
        # - 新增 nvram: ss_vless_net / ss_vless_tls / ss_vless_host / ss_vless_path
        # - 透明代理复用 ss-rules(REDIR/TPROXY), xray 以 dokodemo-door 承接本地端口
        ############################################################################
        # 1) 新包 trunk/user/xray (本仓库维护, 同看门狗拷入机制)
        mkdir -p /opt/rt-n56u/trunk/user/xray
        cp "$GITHUB_WORKSPACE/trunk/user/xray/Makefile" /opt/rt-n56u/trunk/user/xray/Makefile
        grep -q 'GOMIPS=softfloat' /opt/rt-n56u/trunk/user/xray/Makefile

        # 2) httpd variables.c: 声明 4 个新 nvram 字段(变更触发重启 shadowsocks)
        python3 - << 'XRAY_VARS_PY'
        p = '/opt/rt-n56u/trunk/user/httpd/variables.c'
        s = open(p).read()
        a = '{"ss_obfs_param","",NULL, EVM_RESTART_SHADOWSOCKS|EVM_RESTART_SS_TUNNEL},'
        assert s.count(a) == 1, 'anchor: ss_obfs_param'
        pos = s.index(a) + len(a)
        line_start = s.rfind('\n', 0, s.index(a)) + 1
        indent = s[line_start:s.index(a)]
        lines = [indent + '{"ss_%s","",NULL, EVM_RESTART_SHADOWSOCKS},' % k
                 for k in ('vless_net', 'vless_tls', 'vless_host', 'vless_path')]
        s = s[:pos] + '\n' + '\n'.join(lines) + s[pos:]
        open(p, 'w').write(s)
        print('variables.c: +4 ss_vless_* keys')
        XRAY_VARS_PY

        # 3) user/Makefile: xray 随 SHADOWSOCKS_ENABLE 编入
        python3 - << 'XRAY_UMK_PY'
        import re
        p = '/opt/rt-n56u/trunk/user/Makefile'
        s = open(p).read()
        m = re.search(r'^dir_\$\(SHADOWSOCKS_ENABLE\)(\s*)\+= shadowsocks$', s, re.M)
        assert m, 'anchor: dir shadowsocks line'
        ins = 'dir_$(SHADOWSOCKS_ENABLE)' + m.group(1) + '+= xray'
        s = s[:m.end()] + '\n' + ins + s[m.end():]
        open(p, 'w').write(s)
        print('user/Makefile: xray built with SHADOWSOCKS')
        XRAY_UMK_PY

        # 4) shadowsocks.sh: ss_type=2 生成 VLESS JSON, 以 xray run 启动, 停止时清理
        python3 - << 'XRAY_SS_PY'
        p = '/opt/rt-n56u/trunk/user/shadowsocks/scripts/shadowsocks.sh'
        s = open(p).read()

        # 4.1 func_gen_ss_json: type2 分支(dokodemo-door 入站 + vless 出站)
        a = 'func_gen_ss_json(){\n'
        assert s.count(a) == 1, 'anchor: func_gen_ss_json'
        branch = (
            a +
            '\tif [ "${ss_type:-0}" = "2" ]; then\n'
            '\t\tvhost="${ss_vless_host:-}"\n'
            '\t\tif [ "${ss_vless_tls:-0}" = "1" ]; then\n'
            '\t\t\tsec_json="\\"security\\": \\"tls\\", \\"tlsSettings\\": {\\"serverName\\": \\"${vhost:-$ss_server}\\"}"\n'
            '\t\telse\n'
            '\t\t\tsec_json="\\"security\\": \\"none\\""\n'
            '\t\tfi\n'
            '\t\tif [ "${ss_vless_net:-tcp}" = "ws" ]; then\n'
            '\t\t\tif [ -n "$vhost" ]; then\n'
            '\t\t\t\tstream_json="\\"network\\": \\"ws\\", \\"wsSettings\\": {\\"path\\": \\"${ss_vless_path:-/}\\", \\"headers\\": {\\"Host\\": \\"$vhost\\"}}"\n'
            '\t\t\telse\n'
            '\t\t\t\tstream_json="\\"network\\": \\"ws\\", \\"wsSettings\\": {\\"path\\": \\"${ss_vless_path:-/}\\"}"\n'
            '\t\t\tfi\n'
            '\t\telse\n'
            '\t\t\tstream_json="\\"network\\": \\"tcp\\""\n'
            '\t\tfi\n'
            '\t\tcat > "$ss_json_file" <<EOF\n'
            '{\n'
            '    "log": { "loglevel": "warning" },\n'
            '    "inbounds": [\n'
            '        {\n'
            '            "port": $ss_local_port,\n'
            '            "protocol": "dokodemo-door",\n'
            '            "settings": { "network": "tcp,udp", "followRedirect": true },\n'
            '            "sniffing": { "enabled": true, "destOverride": [ "http", "tls" ] }\n'
            '        }\n'
            '    ],\n'
            '    "outbounds": [\n'
            '        {\n'
            '            "protocol": "vless",\n'
            '            "settings": {\n'
            '                "vnext": [\n'
            '                    {\n'
            '                        "address": "$ss_server",\n'
            '                        "port": ${ss_server_port:-443},\n'
            '                        "users": [ { "id": "$ss_key", "encryption": "none" } ]\n'
            '                    }\n'
            '                ]\n'
            '            },\n'
            '            "streamSettings": { $stream_json, $sec_json }\n'
            '        }\n'
            '    ],\n'
            '    "routing": { "domainStrategy": "AsIs" }\n'
            '}\n'
            'EOF\n'
            '\t\treturn 0\n'
            '\tfi\n')
        s = s.replace(a, branch, 1)

        # 4.2 func_start_ss_redir: type2 用 xray run 启动(-u 等 ss 参数不适用)
        a = 'func_start_ss_redir(){\n'
        assert s.count(a) == 1, 'anchor: func_start_ss_redir'
        branch = (
            a +
            '\tif [ "${ss_type:-0}" = "2" ]; then\n'
            '\t\tsh -c "xray run -c $ss_json_file & "\n'
            '\t\treturn $?\n'
            '\tfi\n')
        s = s.replace(a, branch, 1)

        # 4.3 func_stop: 同时清理 xray
        a = '\tkillall -q $ss_bin\n'
        assert s.count(a) == 1, 'anchor: killall ss_bin'
        s = s.replace(a, a + '\tkillall -q xray\n', 1)

        open(p, 'w').write(s)
        print('shadowsocks.sh: type2 xray branch added')
        XRAY_SS_PY

        # 5) ss-tunnel.sh: xray 模式下 ss-tunnel 不适用(VLESS 无对应客户端), 跳过启动
        python3 - << 'XRAY_TUN_PY'
        p = '/opt/rt-n56u/trunk/user/shadowsocks/scripts/ss-tunnel.sh'
        s = open(p).read()
        a = 'func_start_ss_tunnel(){\n'
        assert s.count(a) == 1, 'anchor: func_start_ss_tunnel'
        s = s.replace(a, a + '\t[ "${ss_type:-0}" = "2" ] && return 0\n', 1)
        open(p, 'w').write(s)
        print('ss-tunnel.sh: skip when xray mode')
        XRAY_TUN_PY

        # 6) Shadowsocks.asp: ss_type 加 Xray(VLESS) 选项 + VLESS 表单行 + 显隐逻辑
        python3 - << 'XRAY_ASP_PY'
        p = '/opt/rt-n56u/trunk/user/www/n56u_ribbon_fixed/Shadowsocks.asp'
        s = open(p).read()

        # 6.1 下拉选项
        a = '<option value="1" >SSR</option>'
        assert s.count(a) == 1, 'anchor: SSR option'
        s = s.replace(a, a + '\n                                                    <option value="2" >Xray (VLESS)</option>', 1)

        # 6.2 method/timeout 行加 id 以便 xray 模式隐藏
        a = '<tr> <th width="50%"><#menu5_16_7#></th>'
        assert s.count(a) == 1, 'anchor: method row'
        s = s.replace(a, '<tr id="row_ss_method"> <th width="50%"><#menu5_16_7#></th>', 1)
        a = '<tr> <th width="50%"><#menu5_16_21#></th>'
        assert s.count(a) == 1, 'anchor: timeout row'
        s = s.replace(a, '<tr id="row_ss_timeout"> <th width="50%"><#menu5_16_21#></th>', 1)

        # 6.3 VLESS 参数行(默认隐藏, xray 模式显示), 插在 本地设置 分节前
        a = '<tr> <th colspan="2" style="background-color: #E3E3E3;"><#menu5_16_8#></th> </tr>'
        assert s.count(a) == 1, 'anchor: section menu5_16_8'
        vless_rows = (
            '<tr id="row_vless_net" style="display:none;"> <th width="50%">VLESS 传输</th>\n'
            '                                            <td>\n'
            '                                                <select name="ss_vless_net" class="input" style="width: 200px;">\n'
            '                                                    <option value="tcp" >TCP</option>\n'
            '                                                    <option value="ws" >WebSocket</option>\n'
            '                                                </select>\n'
            '                                            </td>\n'
            '                                        </tr>\n'
            '\n'
            '                                        <tr id="row_vless_tls" style="display:none;"> <th width="50%">TLS</th>\n'
            '                                            <td>\n'
            '                                                <select name="ss_vless_tls" class="input" style="width: 200px;">\n'
            '                                                    <option value="0" >关闭</option>\n'
            '                                                    <option value="1" >开启</option>\n'
            '                                                </select>\n'
            '                                            </td>\n'
            '                                        </tr>\n'
            '\n'
            '                                        <tr id="row_vless_host" style="display:none;"> <th width="50%">域名 (SNI/Host)</th>\n'
            '                                            <td>\n'
            '                                                <input type="text" maxlength="128" class="input" size="64" name="ss_vless_host" value="<% nvram_get_x("","ss_vless_host"); %>" />\n'
            '                                            </td>\n'
            '                                        </tr>\n'
            '\n'
            '                                        <tr id="row_vless_path" style="display:none;"> <th width="50%">WS 路径</th>\n'
            '                                            <td>\n'
            '                                                <input type="text" maxlength="128" class="input" size="64" name="ss_vless_path" value="<% nvram_get_x("","ss_vless_path"); %>" />\n'
            '                                            </td>\n'
            '                                        </tr>\n'
            '\n'
            '                                        ')
        s = s.replace(a, vless_rows + a, 1)

        # 6.4 switch_ss_type 重写: 显隐逻辑支持 type=2
        old_js = (
            'function switch_ss_type(){\n'
            "\tvar v = document.form.ss_type.value; //0:ss-orig;1:ssr\n"
            "\tshowhide_div('row_ss_protocol', v);\n"
            "\tshowhide_div('row_ss_protocol_para', v);\n"
            "\tshowhide_div('row_ss_obfs', v);\n"
            "\tshowhide_div('row_ss_obfs_para', v);\n"
            '}\n')
        assert s.count(old_js) == 1, 'anchor: switch_ss_type js'
        new_js = (
            'function switch_ss_type(){\n'
            "\tvar v = document.form.ss_type.value; //0:ss;1:ssr;2:xray(vless)\n"
            '\tvar is_ssr = (v == 1);\n'
            '\tvar is_xray = (v == 2);\n'
            "\tshowhide_div('row_ss_protocol', is_ssr ? 1 : 0);\n"
            "\tshowhide_div('row_ss_protocol_para', is_ssr ? 1 : 0);\n"
            "\tshowhide_div('row_ss_obfs', is_ssr ? 1 : 0);\n"
            "\tshowhide_div('row_ss_obfs_para', is_ssr ? 1 : 0);\n"
            "\tshowhide_div('row_ss_method', is_xray ? 0 : 1);\n"
            "\tshowhide_div('row_ss_timeout', is_xray ? 0 : 1);\n"
            "\tshowhide_div('row_vless_net', is_xray ? 1 : 0);\n"
            "\tshowhide_div('row_vless_tls', is_xray ? 1 : 0);\n"
            "\tshowhide_div('row_vless_host', is_xray ? 1 : 0);\n"
            "\tshowhide_div('row_vless_path', is_xray ? 1 : 0);\n"
            '}\n')
        s = s.replace(old_js, new_js, 1)

        open(p, 'w').write(s)
        print('Shadowsocks.asp: xray option + vless rows + switch logic')
        XRAY_ASP_PY

        # 7) web_ex.c: 运行状态检测兼容 xray 进程
        python3 - << 'XRAY_WEB_PY'
        p = '/opt/rt-n56u/trunk/user/httpd/web_ex.c'
        s = open(p).read()
        a = 'int ss_status_code = pids("ss-redir");'
        assert s.count(a) == 1, 'anchor: pids ss-redir'
        s = s.replace(a, a + '\n\tif (!ss_status_code)\n\t\tss_status_code = pids("xray");', 1)
        open(p, 'w').write(s)
        print('web_ex.c: status check includes xray')
        XRAY_WEB_PY

        # 8) 校验
        grep -q 'ss_vless_net' /opt/rt-n56u/trunk/user/httpd/variables.c
        grep -q 'dokodemo-door' /opt/rt-n56u/trunk/user/shadowsocks/scripts/shadowsocks.sh
        grep -q 'xray run -c' /opt/rt-n56u/trunk/user/shadowsocks/scripts/shadowsocks.sh
        grep -q 'value="2" >Xray (VLESS)' /opt/rt-n56u/trunk/user/www/n56u_ribbon_fixed/Shadowsocks.asp
        grep -q 'row_vless_net' /opt/rt-n56u/trunk/user/www/n56u_ribbon_fixed/Shadowsocks.asp
        grep -q '+= xray' /opt/rt-n56u/trunk/user/Makefile
        grep -q 'pids("xray")' /opt/rt-n56u/trunk/user/httpd/web_ex.c
        echo "Xray VLESS prepare OK"

    - name: Add anti-freeze network watchdog
      run: |
        ###############################################
        # 卡死自动恢复: 检测卡死 -> 停止无关程序 -> 保证联网 -> 必要时重启
        ###############################################
        # 1. 复制看门狗脚本(来自本仓库, 纳入版本管理)
        cp "$GITHUB_WORKSPACE/trunk/user/scripts/network_watchdog.sh" /opt/rt-n56u/trunk/user/scripts/network_watchdog.sh
        chmod +x /opt/rt-n56u/trunk/user/scripts/network_watchdog.sh

        # 2. 打包进固件: scripts/Makefile romfs 目标追加安装到 /usr/bin/
        printf '\t$(ROMFSINST) -p +x ./network_watchdog.sh /usr/bin/network_watchdog.sh\n' >> /opt/rt-n56u/trunk/user/scripts/Makefile

        # 3. 注册 cron: rc.c init_crontab() 每分钟执行 (仿 ss-watchcat 机制)
        python3 - << 'PYEOF'
        p = '/opt/rt-n56u/trunk/user/rc/rc.c'
        s = open(p).read()
        anchor = 'int ret = 0; //no change'
        assert anchor in s, 'rc.c anchor not found, source changed!'
        ins = anchor + '\n\tret |= system("/sbin/check_crontab.sh a/1 a a a a network_watchdog.sh");'
        s = s.replace(anchor, ins, 1)
        open(p, 'w').write(s)
        print('rc.c patched: cron registered')
        PYEOF

        # 4. 校验
        grep -q 'network_watchdog' /opt/rt-n56u/trunk/user/scripts/Makefile && echo "Makefile OK"
        grep -q 'network_watchdog' /opt/rt-n56u/trunk/user/rc/rc.c && echo "rc.c OK"

    - name: Setup Go for Xray core build
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        cache: false

    - name: Expose go to sudo build
      run: |
        # build_firmware 以 sudo 运行, secure_path 不含 hostedtoolcache → 链到 /usr/local/bin
        set -e
        GODIR="$(dirname "$(command -v go)")"
        sudo ln -sf "$GODIR/go" /usr/local/bin/go
        sudo ln -sf "$GODIR/gofmt" /usr/local/bin/gofmt
        go version

    - name: Build Firmware
      env:
        TNAME: K2P-USB-512
      run: |
        cd /opt/rt-n56u/trunk
        ################################################################################################
        # 修改默认IP地址（如需修改请取消注释并修改）
        ################################################################################################
        #sed -i 's/192.168.123.1/192.168.x.x/g' user/shared/defaults.h
        if [ ! -f configs/templates/$TNAME.config ] ; then
        echo "configs/templates/$TNAME.config not found "
        exit 1
        fi
        cp -f configs/templates/$TNAME.config .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=n/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y/g' .config
        ################################################################################################
        # K2P-512 优化配置 - 修复已知问题
        ################################################################################################
        # 1. 禁用可能导致内存泄漏的服务
        sed -i '/CONFIG_FIRMWARE_INCLUDE_MENTOHUST/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SSSERVER/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ADBYBY/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPC/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_TUNSAFE/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ALIDDNS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SMARTDNS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SRELAY/d' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=n/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y/g' .config
        
        ################################################################################################
        # K2P-512 功能配置 - 根据需求调整
        ################################################################################################
        # 科学上网（K2P-512 内存有限，建议按需启用）
        echo "CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SSOBFS=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SSSERVER=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_V2RAY=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_TROJAN=n" >> .config
        
        # 广告过滤（K2P-512 内存有限，建议禁用）
        echo "CONFIG_FIRMWARE_INCLUDE_ADBYBY=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_KOOLPROXY=n" >> .config
        
        # DNS 服务（K2P-512 内存有限，建议禁用额外 DNS 服务）
        echo "CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SMARTDNS=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SMARTDNSBIN=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_ADGUARDHOME=n" >> .config
        
        # 文件管理（USB 存储相关）
        echo "CONFIG_FIRMWARE_INCLUDE_CADDY=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_CADDYBIN=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_ARIA2_NEW_PREBUILD_BIN=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_ARIA_WEB_CONTROL=y" >> .config
        
        # 其他功能
        echo "CONFIG_FIRMWARE_INCLUDE_WYY=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_WYYBIN=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_ZEROTIER=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SRELAY=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_ALIDDNS=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_FRPC=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_FRPS=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_TUNSAFE=n" >> .config
        
        # K2P-512 稳定性优化
        echo "CONFIG_FIRMWARE_INCLUDE_SFE=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_HTOP=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_TCPDUMP=y" >> .config
        
        ################################################################################################
        # K2P-512 自定义说明
        ################################################################################################
        # Padavan 的用户脚本通过 Web 界面(扩展功能->自定义脚本)写入 nvram(/etc/storage/)，
        # 不随源码树打包进固件。编译期只能修改 defaults.h 等默认值。
        # DNS/防火墙/MTU 等问题请刷机后在 Web 界面配置，不要使用 uci 命令(Padavan 无 uci)。
        sed -i 's/DEF_NTP_SERVER0.*/DEF_NTP_SERVER0 "ntp1.aliyun.com"/' user/shared/defaults.h
        sed -i 's/DEF_NTP_SERVER1.*/DEF_NTP_SERVER1 "ntp.aliyun.com"/' user/shared/defaults.h
        echo "TNAME=$TNAME" >> $GITHUB_ENV

        ################################################################################################
        # 编译固件
        ################################################################################################
        sudo ./clear_tree
        sudo ./build_firmware_modify $TNAME 0
        sudo mv -f images/*.trx /opt/images
    
    - name: Create archive
      if: ${{ github.event_name != 'release' && success() }}
      run: |
        cd /opt/rt-n56u
        GIT_VERSION=`git rev-parse --short=7 HEAD 2>/dev/null` && [ -n "$GIT_VERSION" ] && \
        image_name=images_${TNAME}_${GIT_VERSION} || image_name=images_${TNAME}
        cd /opt/images; md5sum *.trx |tee md5sum.txt; 7z a -mx=9 ${image_name}.7z ./*
        echo "image_name=${image_name}" >> $GITHUB_ENV
          
    - name: Generate release tag
      id: tag
      run: |
        echo "release_tag=K2P-512_$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.workflow_token }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: /opt/images/*.trx
